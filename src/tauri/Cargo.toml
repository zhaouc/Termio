[package]
name = "termio"
version = "1.0.0"
description = "Live GPU & CPU monitoring for every server"
authors = ["Termio"]
edition = "2024"
default-run = "termio"

[lib]
name = "termio_lib"
path = "rust/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "termio"
path = "rust/main.rs"

[features]
default = []
integration-probe = []

[[bin]]
name = "termio-probe"
path = "rust/bin/termio-probe.rs"
required-features = ["integration-probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2" # Unused; kept to maintain the locked dependency graph for CI.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
sha2 = "0.10"
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"
